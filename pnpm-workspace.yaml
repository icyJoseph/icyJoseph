# pnpm 11+ install settings (peer rules, builds, release-age).
confirmModulesPurge: false
# Exact pins in package.json; skip the default "wait N days after publish" gate.
minimumReleaseAge: 0
peerDependencyRules:
  allowedVersions:
    typescript: "*"
# Deny all third-party build scripts (browser WebGPU; msw has no worker dir;
# unrs-resolver ships optional native bindings without needing postinstall).
allowBuilds:
  "@vgpu/adapter-node": false
  msw: false
  unrs-resolver: false
  webgpu: false
