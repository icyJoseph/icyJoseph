# pnpm 11+ install settings (peer rules, builds, release-age).
confirmModulesPurge: false
# Exact pins in package.json; skip the default "wait N days after publish" gate.
minimumReleaseAge: 0
peerDependencyRules:
  allowedVersions:
    typescript: "*"
# Only scripts we actually need. Others: deny (browser WebGPU / no msw worker dir).
allowBuilds:
  "@vgpu/adapter-node": false
  msw: false
  unrs-resolver: true
  webgpu: false
